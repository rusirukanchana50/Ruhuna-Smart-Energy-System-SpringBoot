# ==============================================================================
# University of Ruhuna - Faculty of Engineering
# Smart Energy Monitoring and Analytics System (Spring Boot Backend)
# Application Configuration (application.properties)
# ==============================================================================

# Application Identity
spring.application.name=ruhuna-smart-energy-system

# Server Port & Network Binding (Supports Render PORT dynamically with 5001 fallback)
server.port=${PORT:5001}
server.address=0.0.0.0

# MongoDB Database Configuration (Supports MongoDB Atlas via SPRING_DATA_MONGODB_URI)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27018/ruhuna_energy_spring}

# Core Buildings Auto-Initialization Toggle for Fresh Cloud Databases
app.init-core-buildings=${APP_INIT_CORE_BUILDINGS:false}

# Session & Cookie Configuration (Secure in Production, Lax for Same-Domain)
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ==============================================================================
# Automatic Energy Simulation Scheduler Configuration
# Strict safety: DISABLED by default until explicitly enabled (SIMULATOR_ENABLED)
# ==============================================================================
simulator.enabled=${SIMULATOR_ENABLED:false}
simulator.interval.ms=15000
simulator.initial-delay.ms=5000
